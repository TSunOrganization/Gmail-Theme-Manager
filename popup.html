<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      width: 260px;
      padding: 15px;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #F2F5F0;
      color: #2D3A2E;
      margin: 0;
    }
    .title {
      font-size: 18px;
      font-weight: bold;
      text-align: center;
      margin-bottom: 20px;
    }
    .color-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
      margin-bottom: 15px;
    }
    .color-option {
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      padding: 10px;
      border-radius: 15px;
      transition: all 0.2s;
      border: 2px solid transparent;
    }
    .color-option:hover {
      background-color: rgba(0,0,0,0.05);
    }
    .color-option.selected {
      border-color: #B5C99A;
      background-color: rgba(181, 201, 154, 0.2);
    }
    .circle {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      box-shadow: 4px 4px 8px #d1d9c9, -4px -4px 8px #ffffff,
                  inset 4px 4px 8px rgba(255,255,255,0.3);
      margin-bottom: 8px;
    }
    .circle.green { background-color: #B5C99A; }
    .circle.red { background-color: #E6A1A1; }
    .circle.black { background-color: #333333; }
    .circle.white { background-color: #FDFDFD; border: 1px solid #eee; }
    
    .label {
      font-size: 12px;
      font-weight: 600;
    }
    #status {
      text-align: center;
      font-size: 11px;
      color: #4CAF50;
      height: 15px;
      margin-bottom: 10px;
      font-weight: bold;
    }
    .footer {
      border-top: 1px solid #d1d9c9;
      padding-top: 10px;
      text-align: center;
      font-size: 10px;
    }
    .social-links {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-top: 5px;
    }
    .social-links a {
      text-decoration: none;
      color: #2D3A2E;
      font-weight: bold;
    }
    .social-links a:hover {
      color: #B5C99A;
    }
    .credit {
      margin-top: 8px;
      color: #555;
    }
  </style>
</head>
<body>
  <div class="title">Claymate Themes</div>
  <div id="status"></div>
  <div class="color-grid">
    <div class="color-option" data-theme="green" id="theme-green">
      <div class="circle green"></div>
      <div class="label">Green</div>
    </div>
    <div class="color-option" data-theme="red" id="theme-red">
      <div class="circle red"></div>
      <div class="label">Red</div>
    </div>
    <div class="color-option" data-theme="black" id="theme-black">
      <div class="circle black"></div>
      <div class="label">Black Metal</div>
    </div>
    <div class="color-option" data-theme="white" id="theme-white">
      <div class="circle white"></div>
      <div class="label">White Milk</div>
    </div>
  </div>
  <div class="footer">
    <div class="social-links">
      <a href="https://github.com/saeedx302" target="_blank">Github</a>
      <a href="https://instagram.com/saeedxdie" target="_blank">Instagram</a>
      <a href="https://t.me/saeedxdie" target="_blank">Telegram</a>
    </div>
    <div class="credit">Create With ❤️ By TSunStudio</div>
    <div style="margin-top: 5px; opacity: 0.6;">v2.1</div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
